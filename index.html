<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XETTRY x CHEATS - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: rgba(26, 26, 46, 0.95);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            text-align: center;
            border: 1px solid rgba(233, 69, 96, 0.3);
            animation: fadeIn 0.8s ease-in-out;
            position: relative;
            backdrop-filter: blur(10px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
            transition: transform 0.3s ease;
        }

        .logo-container img:hover {
            transform: scale(1.05);
        }

        .brand-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        h2 {
            margin-bottom: 20px;
            color: #e2e2e2;
            font-size: 20px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #b2bec3;
            font-size: 13px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #e94560;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.4);
            background: #1a1a3a;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e94560, #d63851);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        .btn:hover {
            background: linear-gradient(135deg, #d63851, #b52c42);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.6);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .links {
            margin-top: 22px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .links a {
            color: #00adb5;
            text-decoration: none;
            transition: 0.2s;
        }

        .links a:hover {
            text-decoration: underline;
            color: #e94560;
        }

        /* एनिमेसन सेक्सन ट्रान्जिसनका लागि */
        .form-section {
            display: none;
            animation: slideUp 0.4s ease forwards;
        }

        .form-section.active {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Channel Logo & Brand Name -->
        <div class="logo-container">
            <img src="https://i.ibb.co/6JDTrTgp/logo.png" alt="XETTRY x CHEATS Logo" onerror="this.src='https://via.placeholder.com/90?text=Logo'">
        </div>
        <div class="brand-title">XETTRY x CHEATS</div>

        <!-- Login Section -->
        <div id="loginSection" class="form-section active">
            <h2>Welcome Back</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUser">Username or Email</label>
                    <input type="text" id="loginUser" required placeholder="Enter your username or email">
                </div>
                <div class="form-group">
                    <label for="loginPass">Password</label>
                    <input type="password" id="loginPass" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <div class="links">
                <a href="#" onclick="switchForm('forgotSection')">Forgot Password?</a>
                <a href="#" onclick="switchForm('registerSection')">Create Account</a>
            </div>
        </div>

        <!-- Register Section -->
        <div id="registerSection" class="form-section">
            <h2>Create Account</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" required placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label for="regUser">Username</label>
                    <input type="text" id="regUser" required placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label for="regPass">Password</label>
                    <input type="password" id="regPass" required placeholder="Create a strong password">
                </div>
                <button type="submit" class="btn">Sign Up</button>
            </form>
            <div class="links" style="justify-content: center;">
                <a href="#" onclick="switchForm('loginSection')">Already have an account? Login</a>
            </div>
        </div>

        <!-- Forgot Password Section -->
        <div id="forgotSection" class="form-section">
            <h2>Reset Password</h2>
            <form id="forgotForm">
                <div class="form-group">
                    <label for="forgotEmail">Registered Email</label>
                    <input type="email" id="forgotEmail" required placeholder="example@gmail.com">
                </div>
                <button type="submit" class="btn">Send Reset Link</button>
            </form>
            <div class="links" style="justify-content: center;">
                <a href="#" onclick="switchForm('loginSection')">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        // Smooth form switching with animations
        function switchForm(targetId) {
            const sections = document.querySelectorAll('.form-section');
            sections.forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(targetId).classList.add('active');
        }
    </script>

</body>
</html>
